<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="logo" aria-label="{{ site.title }}">
        <span class="logo-name">{{ site.title }}</span><span class="logo-dot">.</span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}"         class="nav-link {% if page.url == '/' %}active{% endif %}">Writing</a>
        <a href="{{ '/about' | relative_url }}"    class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a>
        <a href="{{ '/projects' | relative_url }}" class="nav-link {% if page.url contains '/projects' %}active{% endif %}">Projects</a>
        <a href="{{ '/search' | relative_url }}"   class="nav-link {% if page.url contains '/search' %}active{% endif %}">Search</a>
        <a href="{{ '/hack' | relative_url }}"     class="nav-cta">Hack</a>
      </nav>

      <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile">
      <a href="{{ '/' | relative_url }}"         class="mobile-nav-link">Writing</a>
      <a href="{{ '/about' | relative_url }}"    class="mobile-nav-link">About</a>
      <a href="{{ '/projects' | relative_url }}" class="mobile-nav-link">Projects</a>
      <a href="{{ '/search' | relative_url }}"   class="mobile-nav-link">Search</a>
      <a href="{{ '/hack' | relative_url }}"     class="mobile-nav-link">Hack</a>
    </nav>
  </header>

  <main class="site-main" id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-copy">© {{ 'now' | date: "%Y" }} {{ site.title }}</span>
      <div class="footer-links">
        <a href="{{ '/search' | relative_url }}"   class="footer-link">Search</a>
        <a href="{{ '/about' | relative_url }}"    class="footer-link">About</a>
        <a href="{{ '/feed.xml' | relative_url }}" class="footer-link" target="_blank" rel="noopener">RSS</a>
      </div>
    </div>
  </footer>

  <script>
    var hdr = document.getElementById('site-header');
    window.addEventListener('scroll', function () {
      hdr.classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    var btn  = document.getElementById('burger');
    var mnav = document.getElementById('mobile-nav');
    btn.addEventListener('click', function () {
      var open = mnav.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
    });
    mnav.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        mnav.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
  </script>

</body>
</html>
