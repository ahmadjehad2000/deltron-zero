<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo" aria-label="{{ site.title }} home">
        <span class="logo-text">{{ site.title }}</span>
        <span class="logo-dot">.</span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="/"        class="nav-link {% if page.url == '/' %}nav-active{% endif %}">Writing</a>
        <a href="/about"   class="nav-link {% if page.url contains '/about' %}nav-active{% endif %}">About</a>
        <a href="/projects" class="nav-link {% if page.url contains '/projects' %}nav-active{% endif %}">Projects</a>
        <a href="/search"  class="nav-link {% if page.url contains '/search' %}nav-active{% endif %}">Search</a>
        <a href="/hack"    class="nav-link nav-special {% if page.url contains '/hack' %}nav-active{% endif %}">Hack</a>
      </nav>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
      <a href="/"        class="mobile-nav-link">Writing</a>
      <a href="/about"   class="mobile-nav-link">About</a>
      <a href="/projects" class="mobile-nav-link">Projects</a>
      <a href="/search"  class="mobile-nav-link">Search</a>
      <a href="/hack"    class="mobile-nav-link">Hack</a>
    </nav>
  </header>

  <!-- ====== MAIN ====== -->
  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  <!-- ====== FOOTER ====== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© {{ 'now' | date: "%Y" }} {{ site.title }}. All transmissions logged.</span>
      <div class="footer-links">
        <a href="/search" class="footer-link">Search</a>
        <a href="/about"  class="footer-link">About</a>
        <a href="/feed.xml" class="footer-link" target="_blank" rel="noopener">RSS</a>
      </div>
    </div>
  </footer>

  <!-- ====== SCRIPTS ====== -->
  <script>
    // Sticky header scroll detection
    var header = document.getElementById('site-header');
    window.addEventListener('scroll', function() {
      if (window.scrollY > 10) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    }, { passive: true });

    // Mobile nav toggle
    var menuBtn  = document.getElementById('mobile-menu-btn');
    var mobileNav = document.getElementById('mobile-nav');
    menuBtn.addEventListener('click', function() {
      var isOpen = mobileNav.classList.toggle('open');
      menuBtn.classList.toggle('active', isOpen);
      menuBtn.setAttribute('aria-expanded', isOpen);
    });

    // Close mobile nav when a link is clicked
    mobileNav.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        mobileNav.classList.remove('open');
        menuBtn.classList.remove('active');
        menuBtn.setAttribute('aria-expanded', 'false');
      });
    });
  </script>

</body>
</html>
