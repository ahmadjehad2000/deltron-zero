---
layout: terminal
title: "Search"
---

<div class="search-page">
  <h1 class="search-heading">Search</h1>

  <div class="search-field">
    <label class="search-label" for="search-input">Query</label>
    <input type="search" id="search-input" class="search-input" placeholder="Search posts…" autofocus>
  </div>

  <div id="search-results" class="search-results">
    <p class="search-prompt">Start typing to search…</p>
  </div>
</div>

<script>
var posts = [
  {% for post in site.posts %}
  {
    title:   {{ post.title | jsonify }},
    url:     {{ post.url   | jsonify }},
    date:    {{ post.date  | date: '%b %d, %Y' | jsonify }},
    content: {{ post.content | strip_html | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];

var input   = document.getElementById('search-input');
var results = document.getElementById('search-results');

input.addEventListener('input', function () {
  var q = this.value.toLowerCase().trim();
  if (q.length < 2) {
    results.innerHTML = '<p class="search-prompt">Start typing to search…</p>';
    return;
  }
  var found = posts.filter(function (p) {
    return p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q);
  });
  if (!found.length) {
    results.innerHTML = '<p class="search-no-results">No posts found for "' + q + '"</p>';
    return;
  }
  var html = '<p class="search-count">' + found.length + ' result' + (found.length === 1 ? '' : 's') + '</p><ul class="search-list">';
  found.forEach(function (p) {
    html += '<li class="search-item"><a href="' + p.url + '">' + p.title + '</a><span class="search-date">' + p.date + '</span></li>';
  });
  html += '</ul>';
  results.innerHTML = html;
});
</script>
